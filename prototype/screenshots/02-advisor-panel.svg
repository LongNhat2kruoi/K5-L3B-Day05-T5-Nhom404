<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f4f7f9"/><rect width="1200" height="82" fill="white"/><text x="48" y="38" font-family="Arial" font-size="26" font-weight="700" fill="#17212b">② Màn hình tư vấn viên — ca đã chuyển</text><text x="48" y="64" font-family="Arial" font-size="15" fill="#65717d">PAIR Graceful Failure · tư vấn viên nhận nguyên ngữ cảnh</text>
<rect x="48" y="116" width="510" height="570" rx="18" fill="white" stroke="#d8e0e8"/><text x="78" y="154" font-family="Arial" font-size="18" font-weight="700" fill="#17212b">Hồ sơ ca #DV-204</text><rect x="78" y="178" width="180" height="32" rx="16" fill="#fee4e2"/><text x="98" y="200" font-family="Arial" font-size="13" font-weight="700" fill="#b42318">Nghi bị lừa</text><rect x="78" y="234" width="450" height="130" rx="12" fill="#eaf1ff" stroke="#155eef"/><text x="98" y="262" font-family="Arial" font-size="14" font-weight="700" fill="#155eef">Tóm tắt hội thoại</text><text x="98" y="290" font-family="Arial" font-size="13" fill="#17212b">Người dùng bị gọi dọa liên quan vụ án.</text><text x="98" y="313" font-family="Arial" font-size="13" fill="#17212b">Yêu cầu nhả giao dịch và nói đã xác thực khuôn mặt.</text><text x="98" y="342" font-family="Arial" font-size="13" fill="#17212b">Lý do chuyển: AI không đủ thẩm quyền.</text><rect x="78" y="388" width="450" height="82" rx="12" fill="#fff4cc" stroke="#ebd28b"/><text x="98" y="416" font-family="Arial" font-size="14" font-weight="700" fill="#9a6700">Giao dịch đang giữ</text><text x="98" y="444" font-family="Arial" font-size="13" fill="#17212b">6.200.000đ · 23:48 · còn 15 phút · Cửa hàng mẫu</text><rect x="78" y="504" width="130" height="44" rx="9" fill="#e7f6ec" stroke="#9bd6b3"/><text x="95" y="531" font-family="Arial" font-size="13" fill="#067647">Giữ giao dịch</text><rect x="220" y="504" width="154" height="44" rx="9" fill="#155eef"/><text x="237" y="531" font-family="Arial" font-size="13" fill="white">Xác minh thêm</text><rect x="386" y="504" width="142" height="44" rx="9" fill="white" stroke="#17212b"/><text x="404" y="531" font-family="Arial" font-size="13" fill="#17212b">Khóa ví</text><rect x="78" y="580" width="450" height="52" rx="9" fill="#b42318"/><text x="203" y="612" font-family="Arial" font-size="14" font-weight="700" fill="white">④ Nhả giao dịch · cần xác nhận</text>
<rect x="600" y="116" width="552" height="570" rx="18" fill="white" stroke="#d8e0e8"/><text x="630" y="154" font-family="Arial" font-size="18" font-weight="700" fill="#17212b">Quyền và nguyên tắc</text><text x="630" y="210" font-family="Arial" font-size="15" fill="#067647">Giữ giao dịch — được thao tác</text><text x="630" y="240" font-family="Arial" font-size="14" fill="#65717d">Có thể giữ tiếp hoặc chuyển bước xác minh.</text><text x="630" y="300" font-family="Arial" font-size="15" fill="#9a6700">Khóa ví — cần chủ ví/tư vấn viên duyệt</text><text x="630" y="330" font-family="Arial" font-size="14" fill="#65717d">Hộp xác nhận phải nói rõ khóa toàn bộ ví.</text><text x="630" y="390" font-family="Arial" font-size="15" fill="#b42318">Nhả giao dịch — không thuộc quyền AI</text><text x="630" y="420" font-family="Arial" font-size="14" fill="#65717d">Chỉ tư vấn viên kiểm tra bằng chứng mới thấy nút.</text><circle cx="1090" cy="208" r="18" fill="#067647"/><text x="1083" y="215" font-family="Arial" font-size="16" font-weight="700" fill="white">③</text><text x="630" y="510" font-family="Arial" font-size="14" fill="#17212b">③ chuyển người giữ nguyên ngữ cảnh</text><text x="630" y="550" font-family="Arial" font-size="14" fill="#17212b">④ hành động nhạy cảm có xác nhận</text><text x="630" y="620" font-family="Arial" font-size="14" fill="#17212b">Nếu hết hạn: không tự nhả, chuyển người xử lý.</text>
</svg>

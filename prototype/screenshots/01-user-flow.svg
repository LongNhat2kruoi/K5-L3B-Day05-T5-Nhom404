<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f4f7f9"/><rect x="0" y="0" width="1200" height="82" fill="white"/><text x="48" y="38" font-family="Arial" font-size="26" font-weight="700" fill="#17212b">① Màn hình người dùng — ca nghi bị lừa</text><text x="48" y="64" font-family="Arial" font-size="15" fill="#65717d">Chat với ví · dữ liệu dựng · AI không có quyền nhả giao dịch</text>
<rect x="48" y="116" width="500" height="570" rx="18" fill="white" stroke="#d8e0e8"/><text x="72" y="148" font-family="Arial" font-size="13" fill="#65717d">Ví của Nguyễn Minh An · 23:48</text><line x1="72" y1="165" x2="524" y2="165" stroke="#d8e0e8"/>
<rect x="250" y="190" width="270" height="62" rx="14" fill="#155eef"/><text x="270" y="216" font-family="Arial" font-size="14" fill="white">Xác thực đúng rồi, mở giúp tôi.</text><text x="270" y="237" font-family="Arial" font-size="14" fill="white">Người ta bảo tôi liên quan vụ án.</text>
<rect x="72" y="274" width="428" height="166" rx="14" fill="#fee4e2" stroke="#f3aaa5"/><text x="92" y="303" font-family="Arial" font-size="15" font-weight="700" fill="#b42318">Dừng lại và không chuyển tiền</text><text x="92" y="330" font-family="Arial" font-size="14" fill="#17212b">Xác thực khuôn mặt đúng không có nghĩa</text><text x="92" y="351" font-family="Arial" font-size="14" fill="#17212b">giao dịch này an toàn. AI không thể tự nhả tiền.</text><circle cx="478" cy="300" r="16" fill="#b42318"/><text x="472" y="306" font-family="Arial" font-size="15" font-weight="700" fill="white">②</text><rect x="92" y="372" width="370" height="50" rx="8" fill="#eaf1ff"/><text x="104" y="393" font-family="Arial" font-size="13" font-weight="700" fill="#155eef">① Mình đang nói về:</text><text x="104" y="411" font-family="Arial" font-size="12" fill="#17212b">6.200.000đ · 23:48 · đang tạm giữ · còn 15 phút</text>
<rect x="72" y="462" width="428" height="82" rx="12" fill="#eaf1ff" stroke="#155eef"/><text x="92" y="488" font-family="Arial" font-size="13" fill="#17212b">Không yêu cầu OTP, mật khẩu hoặc số thẻ.</text><text x="92" y="512" font-family="Arial" font-size="13" fill="#17212b">Giao dịch chỉ được xem, xác minh hoặc chuyển người.</text><rect x="72" y="570" width="125" height="42" rx="9" fill="white" stroke="#17212b"/><text x="91" y="596" font-family="Arial" font-size="13" fill="#17212b">Xem giao dịch</text><rect x="208" y="570" width="122" height="42" rx="9" fill="#155eef"/><text x="229" y="596" font-family="Arial" font-size="13" fill="white">Xác minh</text><rect x="342" y="570" width="158" height="42" rx="9" fill="#b42318"/><text x="358" y="596" font-family="Arial" font-size="13" fill="white">Chuyển tư vấn viên</text>
<rect x="590" y="116" width="562" height="570" rx="18" fill="white" stroke="#d8e0e8"/><text x="620" y="154" font-family="Arial" font-size="18" font-weight="700" fill="#17212b">Các quyết định an toàn</text><text x="620" y="198" font-family="Arial" font-size="15" fill="#067647">giu_giao_dich — Tự làm</text><text x="620" y="228" font-family="Arial" font-size="14" fill="#65717d">Giữ trong 15 phút; không tự nhả khi hết hạn.</text><text x="620" y="282" font-family="Arial" font-size="15" fill="#9a6700">yeu_cau_xac_minh — Cần người duyệt</text><text x="620" y="312" font-family="Arial" font-size="14" fill="#65717d">Chủ ví bấm trên màn hình chính thức.</text><text x="620" y="366" font-family="Arial" font-size="15" fill="#067647">chuyen_tu_van_vien — Tự làm</text><text x="620" y="396" font-family="Arial" font-size="14" fill="#65717d">Giữ nguyên chat và giao dịch khi chuyển.</text><text x="620" y="450" font-family="Arial" font-size="15" fill="#b42318">nha_giao_dich — Cấm AI</text><text x="620" y="480" font-family="Arial" font-size="14" fill="#65717d">Không có nút nhả trên màn hình AI.</text><text x="620" y="570" font-family="Arial" font-size="14" fill="#17212b">① Evidence / G2 · ② Uncertainty / G10</text><text x="620" y="602" font-family="Arial" font-size="14" fill="#17212b">Control / G8-G9 · Graceful failure / PAIR</text>
</svg>
